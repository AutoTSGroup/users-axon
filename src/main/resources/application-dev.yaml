spring:
  application:
    name: users

  datasource:
    url: jdbc:postgresql://localhost:5432/autoTradingSystem?currentSchema=users_axon
    username: postgres
    password: test

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: users_axon
    show-sql: false

  liquibase:
    enabled: true
    change-log: db/migrations/main-changelog.xml
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/autoTradingSystem?currentSchema=users_axon
    user: postgres
    password: test

axon:
  axonserver:
    client-id: user-service


server:
  port: 8086
